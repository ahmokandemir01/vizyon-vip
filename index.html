<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>VizyonBet VIP — Giriş İstasyonu</title>
<style>
  :root{
    --navy-950:#05070f;
    --navy-900:#080c1f;
    --navy-800:#0c1330;
    --navy-700:#141d47;
    --gold-500:#d4af6a;
    --gold-300:#f0d9a8;
    --cyan-400:#3fd0e0;
    --violet-400:#8b6bff;
    --text-primary:#eef1fb;
    --text-muted:#8a92b8;
    --danger:#ff6b7a;
    --success:#4ee6a8;
    --radius-card:22px;
    --radius-field:12px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--navy-950);
    color:var(--text-primary);
    font-family:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    padding:32px 20px;
  }

  /* ---------- background ---------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(60% 50% at 50% -10%, rgba(63,208,224,0.15) 0%, rgba(63,208,224,0) 60%),
      radial-gradient(50% 40% at 85% 90%, rgba(212,175,106,0.10) 0%, rgba(212,175,106,0) 65%),
      linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
  }

  .bg::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.026) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.026) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(60% 60% at 50% 30%, #000 20%, transparent 85%);
  }

  .beam{
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.5;
    pointer-events:none;
  }
  .beam-a{ top:-160px; left:-120px; background:rgba(63,208,224,0.20); animation:drift 16s ease-in-out infinite; }
  .beam-b{ bottom:-180px; right:-140px; background:rgba(212,175,106,0.16); animation:drift 20s ease-in-out infinite reverse; }

  @keyframes drift{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(30px,-20px); }
  }

  @media (prefers-reduced-motion: reduce){
    .beam{ animation:none; }
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:412px;
    background:linear-gradient(180deg, rgba(20,29,66,0.92) 0%, rgba(8,12,31,0.94) 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:var(--radius-card);
    padding:36px 32px 28px;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,0.65),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 1px 0 rgba(255,255,255,0.06) inset;
    backdrop-filter:blur(20px);
    animation:rise 0.6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- border-tracing running light ---------- */
  .card-outline{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    overflow:visible;
  }
  .card-outline rect{
    animation:trace-dash 8s linear infinite;
  }
  @keyframes trace-dash{
    to{ stroke-dashoffset:-1000; }
  }
  @media (prefers-reduced-motion: reduce){
    .card-outline rect{ animation:none; }
  }

  /* ---------- brand ---------- */
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }

  .brand img{
    height:30px;
    width:auto;
    display:block;
    position:relative;
  }

  /* ---------- badge + heading ---------- */
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin:0 auto 18px;
    padding:6px 14px 6px 10px;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(212,175,106,0.16), rgba(212,175,106,0.06));
    border:1px solid rgba(212,175,106,0.35);
    color:var(--gold-300);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.01em;
  }
  .badge svg{ width:13px; height:13px; }

  .heading-wrap{ text-align:center; margin-bottom:26px; }

  h1{
    margin:0 0 10px;
    font-size:23px;
    font-weight:800;
    letter-spacing:-0.01em;
    color:var(--text-primary);
    position:relative;
    display:inline-block;
  }

  .subtitle{
    margin:0;
    font-size:13.5px;
    line-height:1.55;
    color:var(--text-muted);
    max-width:292px;
    margin-inline:auto;
  }

  /* ---------- form ---------- */
  form{ display:flex; flex-direction:column; gap:8px; }

  label{
    font-size:12px;
    font-weight:700;
    color:var(--text-muted);
    letter-spacing:0.01em;
    margin-bottom:2px;
    display:block;
  }

  .field{
    position:relative;
    display:flex;
    align-items:center;
  }

  .field input{
    width:100%;
    background:rgba(4,8,24,0.65);
    border:1.5px solid rgba(255,255,255,0.10);
    border-radius:var(--radius-field);
    padding:14px 44px 14px 15px;
    font-size:15px;
    color:var(--text-primary);
    outline:none;
    transition:border-color .45s ease, box-shadow .45s ease, background .18s ease;
    font-family:inherit;
  }

  .field input::placeholder{ color:#5b6392; }

  .field input:focus{
    border-color:var(--cyan-400);
    box-shadow:0 0 0 4px rgba(63,208,224,0.14);
    background:rgba(4,8,24,0.85);
  }

  .field.shake input{ border-color:var(--danger); }
  .field.shake{ animation:shake .38s cubic-bezier(.36,.07,.19,.97) both; }

  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }

  /* ---------- wraparound validity ring ---------- */
  .field-outline{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
    z-index:1;
  }
  .field-outline rect{
    transition:stroke-dasharray .5s ease, stroke .3s ease, opacity .3s ease;
    filter:drop-shadow(0 0 5px currentColor);
  }

  .eye-btn{
    position:absolute;
    right:6px;
    width:34px;
    height:34px;
    border:none;
    background:transparent;
    color:#6d76a3;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    transition:color .15s ease, background .15s ease;
  }
  .eye-btn:hover{ color:var(--text-primary); background:rgba(255,255,255,0.06); }
  .eye-btn svg{ width:18px; height:18px; }

  .msg{
    min-height:18px;
    font-size:12.5px;
    font-weight:600;
    margin-top:2px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .msg.error{ color:var(--danger); }
  .msg.success{ color:var(--success); }

  button.submit{
    margin-top:12px;
    position:relative;
    width:100%;
    border:none;
    border-radius:var(--radius-field);
    padding:15px 20px;
    font-size:14.5px;
    font-weight:800;
    letter-spacing:0.02em;
    color:#04101f;
    background:linear-gradient(135deg, var(--cyan-400), #2c8ef0);
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    box-shadow:0 14px 30px -12px rgba(63,208,224,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  button.submit .btn-text,
  button.submit .spinner{
    position:relative;
    z-index:1;
  }

  button.submit:hover{ transform:translateY(-1px); box-shadow:0 18px 34px -12px rgba(63,208,224,0.65); }
  button.submit:active{ transform:translateY(0); }
  button.submit:disabled{ opacity:0.75; cursor:default; transform:none; }

  button.submit .spinner{
    width:16px;
    height:16px;
    border-radius:50%;
    border:2.5px solid rgba(4,16,31,0.28);
    border-top-color:#04101f;
    animation:spin .7s linear infinite;
    display:none;
  }
  button.submit.loading .spinner{ display:inline-block; }
  button.submit.loading .btn-text{ opacity:0.85; }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* success takeover */
  .success-wrap{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:6px 0 2px;
  }
  .success-wrap.active{ display:flex; }

  .success-ring{
    width:56px;
    height:56px;
    border-radius:50%;
    border:2px solid rgba(78,230,168,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:16px;
    position:relative;
  }
  .success-ring::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--success);
    animation:spin .9s linear infinite;
  }
  .success-ring svg{ width:22px; height:22px; color:var(--success); }

  .success-title{
    font-size:15.5px;
    font-weight:800;
    color:var(--text-primary);
    margin:0 0 4px;
    position:relative;
    letter-spacing:0.01em;
  }
  .success-title .glyph{ display:inline-block; }
  .success-title.glitching .glyph{ animation:tiny-glitch .35s steps(2,end) infinite; }

  @keyframes tiny-glitch{
    0%,100%{ transform:translate(0,0); opacity:1; }
    50%{ transform:translate(1px,-1px); opacity:0.75; }
  }

  .success-sub{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0;
  }

  .progress-track{
    width:100%;
    height:3px;
    border-radius:3px;
    background:rgba(255,255,255,0.08);
    margin-top:18px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:3px;
    background:linear-gradient(90deg, var(--cyan-400), var(--success));
    animation:fillbar .8s ease forwards;
  }
  @keyframes fillbar{ to{ width:100%; } }

  .footnote{
    margin:18px 0 0;
    text-align:center;
    font-size:11.5px;
    color:#5b6392;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .footnote svg{ width:12px; height:12px; flex-shrink:0; }

  .security-row{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,0.07);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }

  .security-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.02em;
    color:#6b7399;
  }

  .security-item svg{
    width:14px;
    height:14px;
    color:var(--success);
    flex-shrink:0;
  }

  @media (max-width:420px){
    .card{ padding:30px 22px 24px; border-radius:18px; }
    h1{ font-size:20px; }
  }

  /* ---------- language toggle ---------- */
  .lang-toggle{
    position:fixed;
    top:18px;
    right:18px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(8,12,31,0.55);
    backdrop-filter:blur(10px);
    color:var(--text-primary);
    font-size:12.5px;
    font-weight:800;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
    font-family:inherit;
  }
  .lang-toggle:hover{
    border-color:rgba(63,208,224,0.5);
    background:rgba(8,12,31,0.78);
    transform:translateY(-1px);
  }
  .lang-toggle svg{ width:14px; height:14px; opacity:0.75; flex-shrink:0; }

  @media (max-width:420px){
    .lang-toggle{ top:14px; right:14px; padding:7px 12px; font-size:11.5px; }
  }
</style>
</head>

    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <button type="submit" class="submit" id="submitBtn">
      <span class="btn-text" id="submitBtnText">Giriş yap</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>
  </form>

  <div class="success-wrap" id="successWrap">
    <div class="success-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <p class="success-title" id="successTitle"><span class="glyph" id="successTitleText">Erişim onaylandı</span></p>
    <p class="success-sub" id="successSub">VIP alana yönlendiriliyorsunuz…</p>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <p class="footnote" id="footnote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <span id="footnoteText">Sadece davetli üyeler içindir</span>
  </p>

  <div class="security-row" id="securityRow">
    <span class="security-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      <span id="sslText">256-bit SSL</span>
    </span>
    <span class="security-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>
      <span id="secureText">Şifreli Bağlantı</span>
    </span>
  </div>

  <svg class="card-outline" id="cardOutline" aria-hidden="true">
    <defs>
      <linearGradient id="outlineGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#3fd0e0" stop-opacity="0"/>
        <stop offset="50%" stop-color="#8fe9f2" stop-opacity="1"/>
        <stop offset="100%" stop-color="#3fd0e0" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect id="outlineRect" x="1" y="1" rx="22" ry="22" fill="none" stroke="url(#outlineGrad)" stroke-width="1.6" pathLength="1000" stroke-dasharray="150 850" stroke-linecap="round"/>
  </svg>

</main>

<script>
  const VALID_PASSWORDS = ["vizyon2026", "vizyonvip"];
  const REDIRECT_URL = "https://vizyon.link";

  const form = document.getElementById("vipForm");
  const pwInput = document.getElementById("pw");
  const field = document.getElementById("field");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");
  const eyeBtn = document.getElementById("eyeBtn");
  const eyeIcon = document.getElementById("eyeIcon");
  const successWrap = document.getElementById("successWrap");
  const successTitle = document.getElementById("successTitle");
  const footnote = document.getElementById("footnote");
  const securityRow = document.getElementById("securityRow");
  const langToggle = document.getElementById("langToggle");
  const langToggleLabel = document.getElementById("langToggleLabel");
  const cardEl = document.querySelector(".card");
  const outlineSvg = document.getElementById("cardOutline");
  const outlineRect = document.getElementById("outlineRect");

  function syncOutline(){
    const w = cardEl.offsetWidth;
    const h = cardEl.offsetHeight;
    outlineSvg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    outlineRect.setAttribute("width", Math.max(w - 2, 0));
    outlineRect.setAttribute("height", Math.max(h - 2, 0));
  }
  syncOutline();
  if (window.ResizeObserver){
    new ResizeObserver(syncOutline).observe(cardEl);
  } else {
    window.addEventListener("resize", syncOutline);
  }

  const I18N = {
    tr: {
      htmlLang:"tr",
      badge:"VIP ERİŞİM",
      heading:"VIP Giriş İstasyonu",
      subtitle:"Bu alan yalnızca davetli üyelere açıktır. Devam etmek için temsilciniz tarafından size verilen özel şifreyi giriniz.",
      pwLabel:"Özel şifre",
      pwPlaceholder:"Şifrenizi girin",
      eyeShow:"Şifreyi göster",
      eyeHide:"Şifreyi gizle",
      submit:"Giriş yap",
      submitLoading:"Doğrulanıyor",
      errorEmpty:"Lütfen özel şifrenizi girin.",
      errorWrong:"Şifre hatalı. Lütfen tekrar deneyin.",
      successTitle:"Erişim onaylandı",
      successSub:"VIP alana yönlendiriliyorsunuz…",
      footnote:"Sadece davetli üyeler içindir",
      ssl:"256-bit SSL",
      secure:"Şifreli Bağlantı",
      code:"TR"
    },
    en: {
      htmlLang:"en",
      badge:"VIP ACCESS",
      heading:"VIP Access Gateway",
      subtitle:"This area is open to invited members only. Enter the private password given to you by your agent to continue.",
      pwLabel:"Private password",
      pwPlaceholder:"Enter your password",
      eyeShow:"Show password",
      eyeHide:"Hide password",
      submit:"Sign in",
      submitLoading:"Verifying",
      errorEmpty:"Please enter your private password.",
      errorWrong:"Incorrect password. Please try again.",
      successTitle:"Access granted",
      successSub:"Redirecting you to the VIP area…",
      footnote:"For invited members only",
      ssl:"256-bit SSL",
      secure:"Encrypted Connection",
      code:"EN"
    }
  };

  let currentLang = "tr";

  function applyLang(lang){
    const t = I18N[lang];
    document.documentElement.lang = t.htmlLang;
    document.getElementById("badgeText").textContent = t.badge;
    document.getElementById("heading").textContent = t.heading;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("pwLabel").textContent = t.pwLabel;
    pwInput.placeholder = t.pwPlaceholder;
    document.getElementById("submitBtnText").textContent = t.submit;
    document.getElementById("successTitleText").textContent = t.successTitle;
    document.getElementById("successSub").textContent = t.successSub;
    document.getElementById("footnoteText").textContent = t.footnote;
    document.getElementById("sslText").textContent = t.ssl;
    document.getElementById("secureText").textContent = t.secure;
    eyeBtn.setAttribute("aria-label", visible ? t.eyeHide : t.eyeShow);
    langToggleLabel.textContent = t.code;
    clearError();
  }

  langToggle.addEventListener("click", () => {
    currentLang = currentLang === "tr" ? "en" : "tr";
    applyLang(currentLang);
  });

  const EYE_OPEN = `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>`;
  const EYE_OFF = `<path d="M3 3l18 18"/><path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a17.7 17.7 0 0 1-3.2 4"/><path d="M6.6 6.6C3.9 8.3 2 12 2 12s4 7 11 7c1.5 0 2.9-.3 4.1-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>`;

  let visible = false;
  eyeBtn.addEventListener("click", () => {
    visible = !visible;
    pwInput.type = visible ? "text" : "password";
    eyeIcon.innerHTML = visible ? EYE_OFF : EYE_OPEN;
    eyeBtn.setAttribute("aria-label", visible ? I18N[currentLang].eyeHide : I18N[currentLang].eyeShow);
  });

  function clearError(){
    field.classList.remove("shake");
    msg.textContent = "";
    msg.className = "msg";
  }

  const fieldOutlineSvg = document.getElementById("fieldOutline");
  const fieldOutlineRect = document.getElementById("fieldOutlineRect");

  function syncFieldOutline(){
    const w = field.offsetWidth;
    const h = field.offsetHeight;
    fieldOutlineSvg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    fieldOutlineRect.setAttribute("width", Math.max(w - 2, 0));
    fieldOutlineRect.setAttribute("height", Math.max(h - 2, 0));
  }
  syncFieldOutline();
  if (window.ResizeObserver){
    new ResizeObserver(syncFieldOutline).observe(field);
  } else {
    window.addEventListener("resize", syncFieldOutline);
  }

  function setFieldRing(progress, colorHex){
    if (!colorHex){
      fieldOutlineRect.style.opacity = "0";
      return;
    }
    fieldOutlineRect.style.opacity = "1";
    fieldOutlineRect.setAttribute("stroke", colorHex);
    fieldOutlineRect.style.color = colorHex;
    const dash = Math.round(progress * 1000);
    fieldOutlineRect.setAttribute("stroke-dasharray", `${dash} ${1000 - dash}`);
  }

  function updatePasswordState(){
    const value = pwInput.value.toLowerCase();

    if (!value){
      pwInput.style.borderColor = "";
      pwInput.style.boxShadow = "";
      setFieldRing(0, null);
      return;
    }

    const matches = VALID_PASSWORDS.filter(p => p.startsWith(value));

    if (matches.length > 0){
      const minLen = Math.min(...matches.map(p => p.length));
      const isComplete = matches.includes(value);
      const progress = isComplete ? 1 : Math.min(value.length / minLen, 1);
      pwInput.style.borderColor = "#4ee6a8";
      pwInput.style.boxShadow = "0 0 0 4px rgba(78,230,168,0.16)";
      setFieldRing(progress, "#4ee6a8");
    } else {
      pwInput.style.borderColor = "#ff6b7a";
      pwInput.style.boxShadow = "0 0 0 4px rgba(255,107,122,0.16)";
      setFieldRing(1, "#ff6b7a");
    }
  }

  pwInput.addEventListener("input", () => {
    clearError();
    updatePasswordState();
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = pwInput.value.trim().toLowerCase();

    if (!value){
      showError(I18N[currentLang].errorEmpty);
      return;
    }

    if (VALID_PASSWORDS.includes(value)){
      showSuccess();
    } else {
      showError(I18N[currentLang].errorWrong);
    }
  });

  function showError(text){
    clearError();
    msg.classList.add("error");
    msg.textContent = text;
    field.classList.add("shake");
    pwInput.style.borderColor = "#ff6b7a";
    pwInput.style.boxShadow = "0 0 0 4px rgba(255,107,122,0.16)";
    setFieldRing(1, "#ff6b7a");
    pwInput.focus();
    setTimeout(() => field.classList.remove("shake"), 400);
  }

  function showSuccess(){
    clearError();
    submitBtn.disabled = true;
    submitBtn.classList.add("loading");
    submitBtn.querySelector(".btn-text").textContent = I18N[currentLang].submitLoading;

    setTimeout(() => {
      form.style.display = "none";
      footnote.style.display = "none";
      securityRow.style.display = "none";
      successWrap.classList.add("active");
      successTitle.classList.add("glitching");
      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, 1100);
    }, 550);
  }

  applyLang(currentLang);
</script>

</body>
</html>
